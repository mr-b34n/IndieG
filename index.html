<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="dns-prefetch" href="https://shared.fastly.steamstatic.com" />
    <link rel="dns-prefetch" href="https://cdn.akamai.steamstatic.com" />
    <link rel="dns-prefetch" href="https://api.dicebear.com" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0B0D0F" />
    <title>Ludon - Mạng Xã Hội & Cộng Đồng Game Thủ</title>
    <style>
      /* Zero-FOUC anti-flash: instantaneous canvas paint before CSS/JS load */
      :root {
        color-scheme: dark light;
      }
      html {
        background-color: #000000;
        color-scheme: dark;
      }
      html.dark {
        background-color: #000000;
        color-scheme: dark;
      }
      html.light {
        background-color: #F4F6F8;
        color-scheme: light;
      }
      body {
        margin: 0;
        background-color: inherit;
        color-scheme: inherit;
      }
    </style>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('theme_mode');
          if (!mode || (mode !== 'light' && mode !== 'dark' && mode !== 'auto')) {
            var legacy = localStorage.getItem('theme');
            mode = (legacy === 'light' || legacy === 'dark') ? legacy : 'auto';
          }
          var resolved = mode;
          if (mode === 'auto') {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            resolved = prefersDark ? 'dark' : 'light';
          }
          var root = document.documentElement;
          if (resolved === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
          root.setAttribute('data-theme', resolved);
          root.style.colorScheme = resolved;
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute('content', resolved === 'dark' ? '#0B0D0F' : '#F4F6F8');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Ludon - Nền tảng mạng xã hội, thảo luận chiến thuật và khám phá game dành riêng cho game thủ." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ludon" />
    <meta property="og:title" content="Ludon - Mạng Xã Hội & Cộng Đồng Game Thủ" />
